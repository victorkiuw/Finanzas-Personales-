name: APK Android

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  # Una compilación nueva espera a que termine la anterior en vez de cancelarla.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Numerar versión con el número de ejecución
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install

      # La carpeta android/ se genera en el paso anterior, así que la caché de
      # Gradle se configura aquí y no en setup-java.
      - uses: gradle/actions/setup-gradle@v5

      # La firma usa el debug.keystore fijo de la plantilla de Expo, así cada APK
      # nuevo se instala encima del anterior sin borrar los datos.
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk finanzas.apk

      - uses: actions/upload-artifact@v5
        with:
          name: finanzas-apk
          path: finanzas.apk

      - name: Publicar en la release "apk-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest finanzas.apk \
            --target "$GITHUB_SHA" \
            --title "Finanzas · build #$GITHUB_RUN_NUMBER" \
            --notes "APK generado desde ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Descárgalo desde el teléfono e instálalo."
